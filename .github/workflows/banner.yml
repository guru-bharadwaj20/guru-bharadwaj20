name: Update Banner View Count

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate banner with current view count
        run: python .github/scripts/generate_banner.py

      - name: Commit if the count changed
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "count unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Update banner view count"
          git push
